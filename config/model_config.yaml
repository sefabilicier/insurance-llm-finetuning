# Model Configuration
# Qwen2.5-3B-Instruct + QLoRA (4-bit) for Google Colab T4 (16GB VRAM)

model:
  # Base model — switched from 7B to 3B for T4 GPU compatibility
  model_name: "Qwen/Qwen2.5-3B-Instruct"
  model_type: "causal_lm"
  tokenizer_name: "Qwen/Qwen2.5-3B-Instruct"
  trust_remote_code: true
  max_seq_length: 2048
  torch_dtype: "float16"       # T4 doesn't support bfloat16 natively
  device_map: "auto"

# LoRA Adapter Configuration
peft:
  peft_type: "LORA"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"
  init_lora_weights: true

# QLoRA 4-bit Quantization — enabled for T4
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

# Optimization
optimization:
  use_flash_attention_2: false    # T4 doesn't support Flash Attention 2
  gradient_checkpointing: true
  pretraining_tp: 1